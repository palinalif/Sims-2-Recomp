plugins { id 'com.android.application' }

android {
    namespace 'org.ts2native.diagnostic'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.ts2native.diagnostic'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-diagnostic'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake {
            cppFlags '-std=c++20'
            arguments '-DANDROID_STL=c++_shared',
                '-DTS2_PRIVATE_LEAF_DIR=' + (System.getenv('TS2_PRIVATE_LEAF_DIR') ?: '')
        } }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.31.6' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}
